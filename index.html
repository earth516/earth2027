<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 수능 지구과학 문제은행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 🖨️ 인쇄(PDF 저장)용 스타일 */
        @media print {
            html, body, main, #main-scroll-area, #question-container {
                height: auto !important;
                min-height: auto !important;
                overflow: visible !important;
                position: static !important;
                display: block !important;
                background: white !important;
            }
            .print-mode .question-card {
                page-break-inside: avoid;
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #e2e8f0;
                margin-bottom: 2rem;
            }
            .print-mode button, 
            .print-mode #timer-display,
            .print-mode header,
            .print-mode aside,
            .print-mode .mock-intro-box,
            .print-mode .draw-toolbar {
                display: none !important;
            }
            .print-q .answer-section { display: none !important; }
            .print-a .question-image-section { display: none !important; }
            .print-a .answer-section { 
                display: block !important; 
                border: none !important; 
                padding: 0 !important; 
                background: transparent !important; 
            }
        }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden flex bg-slate-50 relative">

    <div id="timer-display" class="hidden fixed top-6 right-6 bg-gray-900 text-white px-6 py-3 rounded-2xl font-mono text-2xl shadow-2xl z-50 flex items-center gap-3 border border-gray-700">
        <svg class="w-6 h-6 text-red-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="time-left" class="font-bold tracking-wider">30:00</span>
    </div>

    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center fade-in">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-5">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 id="modal-title" class="text-2xl font-bold text-gray-800 mb-2">알림</h3>
            <p id="modal-message" class="text-gray-600 mb-8 font-medium">메시지 내용</p>
            <button onclick="closeModal()" class="w-full px-4 py-3.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-colors font-bold text-lg shadow-sm">확인</button>
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 z-40 flex-shrink-0 transition-all duration-300 absolute md:static h-full transform -translate-x-full md:translate-x-0 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="p-6 flex-1 overflow-y-auto">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
                <h1 class="text-2xl font-extrabold text-blue-600 tracking-tight">지구과학 문제은행</h1>
                <button onclick="toggleSidebar()" class="md:hidden p-2 text-gray-400 hover:text-gray-600 bg-gray-50 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- 교재 선택 드롭다운 -->
            <div class="mb-8">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 px-2">교재 선택</h2>
                <select id="book-selector" onchange="changeBook(this.value)" class="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50 text-gray-700 font-bold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow outline-none cursor-pointer shadow-sm">
                    <option value="main">📘 2027 수능 대비 (기본)</option>
                    <option value="suwan">📙 2027 수능완성</option>
                </select>
            </div>
            
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 px-2">단원 선택</h2>
            <nav id="chapter-nav" class="space-y-1.5 mb-10">
                <!-- Chapters will be rendered here -->
            </nav>

            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 px-2">+기능</h2>
            <nav class="space-y-1.5">
                <button onclick="showMockExamIntro()" class="w-full text-left px-4 py-3.5 rounded-xl transition-all duration-200 font-semibold text-purple-700 bg-purple-50 hover:bg-purple-100 flex items-center justify-between border border-purple-100 hover:border-purple-200 hover:shadow-sm">
                    <span class="flex items-center gap-2.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        모의고사 만들기
                    </span>
                </button>
            </nav>
        </div>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900 bg-opacity-20 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden w-full bg-slate-50 relative">
        <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 z-10 px-6 py-4 flex items-center gap-4 flex-shrink-0">
            <button onclick="toggleSidebar()" class="p-2.5 bg-white rounded-xl shadow-sm border border-gray-200 text-gray-600 hover:text-blue-600 hover:border-blue-200 hover:bg-blue-50 transition-all flex-shrink-0" title="메뉴 숨기기/보이기">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
            </button>
            <div class="overflow-hidden">
                <h2 id="current-chapter-title" class="text-xl md:text-2xl font-bold text-gray-800 truncate">단원을 선택해주세요</h2>
                <p id="current-chapter-desc" class="text-sm text-gray-500 mt-0.5 truncate">왼쪽 메뉴에서 단원이나 기능을 선택하세요.</p>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 md:p-10" id="main-scroll-area">
            <div id="question-container" class="max-w-4xl mx-auto space-y-8 hidden pb-20"></div>
            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center fade-in pb-20">
                <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 mb-6">
                    <svg class="w-12 h-12 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-700 mb-2" id="welcome-title">학습을 시작해볼까요?</h3>
                <p class="text-gray-500" id="welcome-desc">왼쪽 메뉴에서 학습할 단원을 선택하면 문제가 표시됩니다.</p>
            </div>
        </div>
    </main>

    <script>
        // 공통 단원 정보
        const chaptersInfo = [
            { id: 'ch1', title: '1. 지권의 변동' },
            { id: 'ch2', title: '2. 지구의 역사' },
            { id: 'ch3', title: '3. 대기와 해양의 변화' },
            { id: 'ch4', title: '4. 상호작용' },
            { id: 'ch5', title: '5. 별과 외계 행성계' },
            { id: 'ch6', title: '6. 외부 은하와 우주 팽창' }
        ];

        // 📚 교재(Book) 설정 객체
        const booksConfig = {
            main: {
                title: "2027 수능 대비 (기본)",
                qDir: "main_q",
                aDir: "main_a",
                // 기존 수능 대비 분류 기준
                getChapterId: function(num) {
                    if (num >= 1 && num <= 48) return 'ch1';
                    if (num >= 49 && num <= 102) return 'ch2';
                    if (num >= 103 && num <= 142) return 'ch3';
                    if (num >= 143 && num <= 206) return 'ch4';
                    if (num >= 207 && num <= 270) return 'ch5';
                    return 'ch6'; 
                }
            },
            suwan: {
                title: "2027 수능완성",
                qDir: "suwan_q",
                aDir: "suwan_a",
                // ⚠️ 중요: 수능완성의 단원별 문항 번호 기준을 선생님께서 직접 수정해 주세요!
                // (현재는 임시로 20문제씩 끊어두었습니다. 실제 파일 번호에 맞게 변경하시면 됩니다.)
                getChapterId: function(num) {
                    if (num >= 1 && num <= 20) return 'ch1';
                    if (num >= 21 && num <= 40) return 'ch2';
                    if (num >= 41 && num <= 60) return 'ch3';
                    if (num >= 61 && num <= 80) return 'ch4';
                    if (num >= 81 && num <= 100) return 'ch5';
                    return 'ch6'; 
                }
            }
        };

        const db = {
            questions: {
                main: [],
                suwan: []
            }
        };

        // DOM Elements
        const chapterNav = document.getElementById('chapter-nav');
        const currentChapterTitle = document.getElementById('current-chapter-title');
        const currentChapterDesc = document.getElementById('current-chapter-desc');
        const questionContainer = document.getElementById('question-container');
        const emptyState = document.getElementById('empty-state');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const timerDisplay = document.getElementById('timer-display');
        const timeLeftSpan = document.getElementById('time-left');
        const customModal = document.getElementById('custom-modal');
        const modalMessage = document.getElementById('modal-message');
        const mainScrollArea = document.getElementById('main-scroll-area');

        let currentBookId = 'main'; // 초기 로딩 교재
        let currentChapterId = null;
        let isMockExamMode = false;
        let timerInterval = null;
        let timeLeft = 1800;
        let isScanning = false;

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebar.classList.toggle('md:-ml-[18rem]'); 
            sidebarOverlay.classList.toggle('hidden');
        }

        function showModal(message) {
            modalMessage.innerText = message;
            customModal.classList.remove('hidden');
        }

        function closeModal() {
            if(!isScanning) {
                customModal.classList.add('hidden');
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerDisplay.classList.add('hidden');
            timerDisplay.classList.remove('fade-in');
        }

        function startTimer() {
            stopTimer();
            timeLeft = 1800;
            timeLeftSpan.innerText = formatTime(timeLeft);
            timeLeftSpan.classList.remove('text-red-400');
            timerDisplay.classList.remove('hidden');
            timerDisplay.classList.add('fade-in');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timeLeftSpan.innerText = formatTime(timeLeft);
                if (timeLeft <= 300) timeLeftSpan.classList.add('text-red-400');
                if (timeLeft <= 0) {
                    stopTimer();
                    showModal("모의고사 제한 시간 30분이 모두 지났습니다. 수고하셨습니다!");
                }
            }, 1000);
        }

        function printPDF(type) {
            document.body.classList.add('print-mode');
            if (type === 'q') document.body.classList.add('print-q');
            if (type === 'a') {
                document.body.classList.add('print-a');
                document.querySelectorAll('.answer-section').forEach(el => el.classList.remove('hidden'));
            }
            window.print();
            setTimeout(() => {
                document.body.classList.remove('print-mode', 'print-q', 'print-a');
                if (type === 'a') {
                    document.querySelectorAll('.answer-section').forEach(el => el.classList.add('hidden'));
                }
            }, 1000);
        }

        function renderNavigation() {
            chapterNav.innerHTML = '';
            chaptersInfo.forEach(chapter => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 rounded-xl transition-all duration-200 font-medium border border-transparent ${
                    currentChapterId === chapter.id && !isMockExamMode
                    ? 'bg-blue-50 text-blue-700 border-blue-100 shadow-sm' 
                    : 'text-gray-600 hover:bg-gray-50 hover:border-gray-100'
                }`;
                btn.innerText = chapter.title;
                btn.onclick = () => selectChapter(chapter.id);
                chapterNav.appendChild(btn);
            });
        }

        function selectChapter(chapterId) {
            currentChapterId = chapterId;
            isMockExamMode = false;
            stopTimer();
            renderNavigation(); 

            const chapter = chaptersInfo.find(c => c.id === chapterId);
            if (chapter) {
                currentChapterTitle.innerText = chapter.title;
                // 해당 교재, 해당 단원의 문제 필터링
                const chapterQuestions = db.questions[currentBookId].filter(q => q.chapterId === chapterId);
                
                // 단원 설명 동적 업데이트 (예: 1번~48번)
                if(chapterQuestions.length > 0) {
                    const minNum = chapterQuestions[0].number;
                    const maxNum = chapterQuestions[chapterQuestions.length - 1].number;
                    currentChapterDesc.innerText = `${minNum}번 ~ ${maxNum}번 (총 ${chapterQuestions.length}문제)`;
                } else {
                    currentChapterDesc.innerText = "이 단원에는 등록된 문제가 없습니다.";
                }
                
                renderQuestions(chapterQuestions);
                emptyState.classList.add('hidden');
                questionContainer.classList.remove('hidden');
                mainScrollArea.scrollTo(0, 0);

                if(window.innerWidth < 768 && !sidebar.classList.contains('-translate-x-full')) toggleSidebar();
            }
        }

        function showMockExamIntro() {
            currentChapterId = null;
            isMockExamMode = true;
            stopTimer();
            renderNavigation(); 

            currentChapterTitle.innerText = "모의고사 만들기";
            currentChapterDesc.innerText = "출제 범위를 선택하고 실전처럼 테스트해 보세요.";

            let checkboxesHtml = chaptersInfo.map(ch => `
                <label class="flex items-center gap-3 p-2 hover:bg-white rounded-lg cursor-pointer transition-colors border border-transparent hover:border-gray-200">
                    <input type="checkbox" value="${ch.id}" checked class="w-5 h-5 text-purple-600 rounded border-gray-300 focus:ring-purple-500 cursor-pointer">
                    <span class="text-gray-700 font-medium text-sm md:text-base">${ch.title}</span>
                </label>
            `).join('');

            questionContainer.innerHTML = `
                <div class="mock-intro-box bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-gray-100 text-center mt-4 md:mt-10 fade-in">
                    <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-4 tracking-tight">모의고사 설정</h3>
                    <p class="text-gray-500 mb-8 max-w-md mx-auto leading-relaxed">선택된 범위 내에서 무작위로 20문제가 출제됩니다.</p>
                    
                    <div class="text-left max-w-2xl mx-auto mb-10 bg-slate-50 p-6 rounded-2xl border border-gray-200 shadow-inner">
                        <h4 class="font-bold text-gray-700 mb-4 px-2 flex items-center gap-2">출제 범위 선택</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="mock-chapter-checkboxes">${checkboxesHtml}</div>
                    </div>

                    <button onclick="startMockExam()" class="px-8 py-4 bg-purple-600 text-white text-lg rounded-2xl hover:bg-purple-700 font-bold flex items-center justify-center gap-3 mx-auto w-full sm:w-auto shadow-md">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        모의고사 시작하기
                    </button>
                    
                    <div id="mock-pdf-buttons" class="hidden justify-center gap-3 mt-6 fade-in flex-wrap">
                        <button onclick="printPDF('q')" class="px-5 py-3 bg-gray-800 text-white text-sm font-bold rounded-xl shadow hover:bg-gray-700 transition-colors flex items-center gap-2">📝 문제 PDF 저장</button>
                        <button onclick="printPDF('a')" class="px-5 py-3 bg-green-700 text-white text-sm font-bold rounded-xl shadow hover:bg-green-600 transition-colors flex items-center gap-2">💡 해설 PDF 저장</button>
                    </div>
                </div>
                <div id="mock-questions-render-area" class="space-y-8 mt-8 pb-10"></div>
            `;
            
            emptyState.classList.add('hidden');
            questionContainer.classList.remove('hidden');
            if(window.innerWidth < 768 && !sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        function startMockExam() {
            const checkboxes = document.querySelectorAll('#mock-chapter-checkboxes input[type="checkbox"]:checked');
            const selectedChapterIds = Array.from(checkboxes).map(cb => cb.value);

            if (selectedChapterIds.length === 0) {
                showModal("출제할 단원을 최소 1개 이상 선택해주세요.");
                return;
            }

            // 현재 선택된 교재 내에서만 필터링
            const filteredQuestions = db.questions[currentBookId].filter(q => selectedChapterIds.includes(q.chapterId));

            if (filteredQuestions.length === 0) {
                showModal("선택한 단원에 문제가 없습니다. 파일이 업로드 되어있는지 확인해주세요.");
                return;
            }

            const allQuestions = [...filteredQuestions];
            for (let i = allQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
            }
            const mockQuestions = allQuestions.slice(0, 20);

            currentChapterDesc.innerText = "제한 시간 30분! 실전처럼 집중해서 풀어보세요.";
            
            const pdfButtons = document.getElementById('mock-pdf-buttons');
            pdfButtons.classList.remove('hidden');
            pdfButtons.classList.add('flex');

            renderQuestions(mockQuestions, true, 'mock-questions-render-area');
            startTimer();
            setTimeout(() => { document.getElementById('mock-questions-render-area').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        }

        function renderQuestions(questions, isMock = false, targetId = 'question-container') {
            const container = document.getElementById(targetId);
            container.innerHTML = '';
            
            if (questions.length === 0) {
                container.innerHTML = `<div class="bg-white p-10 rounded-2xl shadow-sm text-center border border-gray-100 fade-in"><p class="text-gray-500">문제가 없습니다. 폴더에 파일이 있는지 확인해주세요.</p></div>`;
                return;
            }

            questions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question-card bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 fade-in transition-shadow hover:shadow-md';
                qEl.style.animationDelay = `${index * 0.05}s`;
                
                let questionLabel = isMock ? `문제 ${index + 1}` : `문제 ${q.number}`;
                let sourceBadge = isMock 
                    ? `<span class="px-3 py-1 bg-purple-50 text-purple-600 rounded-full text-xs font-bold border border-purple-100">${chaptersInfo.find(c=>c.id===q.chapterId)?.title.split(' ')[0]} 단원</span>` 
                    : `<span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-bold border border-blue-100">${booksConfig[currentBookId].title}</span>`;

                qEl.innerHTML = `
                    <div class="p-6 md:p-8">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xl font-extrabold text-gray-800">${questionLabel}</h3>
                            ${sourceBadge}
                        </div>
                        
                        <div class="draw-toolbar flex justify-end gap-2 mb-3">
                            <div id="draw-tools-${q.id}" class="hidden items-center gap-2 bg-gray-100 px-3 py-1.5 rounded-lg shadow-inner">
                                <button onclick="setDrawColor('${q.id}', 'black', this)" class="w-6 h-6 rounded-full bg-black ring-2 ring-offset-1 ring-gray-400 transition-all color-btn-${q.id}"></button>
                                <button onclick="setDrawColor('${q.id}', 'red', this)" class="w-6 h-6 rounded-full bg-red-500 ring-2 ring-offset-1 ring-transparent transition-all color-btn-${q.id}"></button>
                                <button onclick="setDrawColor('${q.id}', 'blue', this)" class="w-6 h-6 rounded-full bg-blue-500 ring-2 ring-offset-1 ring-transparent transition-all color-btn-${q.id}"></button>
                                <div class="w-px h-5 bg-gray-300 mx-1"></div>
                                <button onclick="setDrawMode('${q.id}', 'eraser')" class="text-sm font-bold text-gray-600 hover:text-gray-900 px-2 py-1 rounded hover:bg-gray-200">지우개</button>
                                <button onclick="clearCanvas('${q.id}')" class="text-sm font-bold text-red-500 hover:text-red-700 px-2 py-1 rounded hover:bg-red-50">전체지우기</button>
                            </div>
                            <button onclick="toggleDrawMode('${q.id}')" id="btn-draw-${q.id}" class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-all font-medium flex items-center gap-1.5 text-sm border border-gray-200">
                                ✏️ 필기 켜기
                            </button>
                        </div>

                        <div class="question-image-section mb-8 border border-gray-100 rounded-xl p-3 bg-gray-50 flex justify-center overflow-hidden">
                            <div class="relative inline-block max-w-full">
                                <img id="img-${q.id}" src="${q.questionImage}" alt="${questionLabel}" class="max-w-full h-auto rounded-lg select-none" draggable="false" onload="setupCanvas('${q.id}')" onerror="this.src='https://placehold.co/800x400/f8fafc/94a3b8?text=이미지+로드+실패'">
                                <canvas id="canvas-${q.id}" class="absolute top-0 left-0 w-full h-full touch-none z-10 rounded-lg" style="pointer-events: none;"></canvas>
                            </div>
                        </div>

                        <div class="flex justify-end border-t border-gray-100 pt-4 mt-2">
                            <button onclick="toggleAnswer('${q.id}')" id="btn-toggle-${q.id}" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition-all font-medium flex items-center gap-1.5 shadow-sm hover:shadow">
                                <span>정답 및 해설 보기</span>
                                <svg class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div id="answer-${q.id}" class="answer-section hidden border-t-2 border-dashed border-gray-200 bg-slate-50/50 p-6 md:p-8">
                        <h4 class="font-extrabold text-gray-700 mb-4 flex items-center gap-2 text-lg">
                            <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            정답 및 해설
                        </h4>
                        <div class="border border-gray-200 rounded-xl p-3 bg-white shadow-sm flex justify-center">
                            <img src="${q.answerImage}" alt="해설" class="max-w-full h-auto rounded-lg" onerror="this.src='https://placehold.co/800x400/f8fafc/94a3b8?text=해설+이미지+로드+실패'">
                        </div>
                    </div>
                `;
                container.appendChild(qEl);
            });
        }

        window.toggleAnswer = function(questionId) {
            const answerDiv = document.getElementById(`answer-${questionId}`);
            const btn = document.getElementById(`btn-toggle-${questionId}`);
            const span = btn.querySelector('span');
            const icon = btn.querySelector('svg');

            if (answerDiv.classList.contains('hidden')) {
                answerDiv.classList.remove('hidden');
                answerDiv.classList.add('fade-in');
                btn.classList.replace('bg-blue-600', 'bg-gray-600');
                btn.classList.replace('hover:bg-blue-700', 'hover:bg-gray-700');
                span.innerText = '해설 닫기';
                icon.style.transform = 'rotate(180deg)';
            } else {
                answerDiv.classList.add('hidden');
                answerDiv.classList.remove('fade-in');
                btn.classList.replace('bg-gray-600', 'bg-blue-600');
                btn.classList.replace('hover:bg-gray-700', 'hover:bg-blue-700');
                span.innerText = '정답 및 해설 보기';
                icon.style.transform = 'rotate(0deg)';
            }
        };

        // 폴더 스캔 (이진 탐색)
        async function checkFileExists(url) {
            try {
                const response = await fetch(url, { method: 'HEAD', cache: 'no-cache' });
                return response.ok;
            } catch {
                return false;
            }
        }

        async function findMaxQuestionCount(dirPath) {
            let low = 1;
            let high = 1;
            if (!(await checkFileExists(`${dirPath}/1번_문제.png`))) return 0; 
            while (await checkFileExists(`${dirPath}/${high}번_문제.png`)) {
                low = high;
                high *= 2;
            }
            let maxFound = low;
            let l = low;
            let h = high - 1;
            while (l <= h) {
                const mid = Math.floor((l + h) / 2);
                if (await checkFileExists(`${dirPath}/${mid}번_문제.png`)) {
                    maxFound = mid;
                    l = mid + 1;
                } else {
                    h = mid - 1;
                }
            }
            return maxFound;
        }

        // 교재 변경 함수
        window.changeBook = async function(bookId) {
            currentBookId = bookId;
            currentChapterId = null;
            isMockExamMode = false;
            stopTimer();

            // UI 리셋
            currentChapterTitle.innerText = "단원을 선택해주세요";
            currentChapterDesc.innerText = "왼쪽 메뉴에서 단원이나 기능을 선택하세요.";
            emptyState.classList.remove('hidden');
            questionContainer.classList.add('hidden');
            document.getElementById('welcome-title').innerText = `${booksConfig[bookId].title} 학습 시작!`;

            await scanCurrentBook();
            renderNavigation();
        }

        async function scanCurrentBook() {
            // 이미 스캔된 교재면 다시 스캔하지 않음
            if (db.questions[currentBookId].length > 0) return;

            isScanning = true;
            showModal("문제를 스캔중입니다.");
            
            const config = booksConfig[currentBookId];
            const maxNum = await findMaxQuestionCount(config.qDir);
            
            for (let i = 1; i <= maxNum; i++) {
                const chapterId = config.getChapterId(i);
                db.questions[currentBookId].push({
                    id: `${currentBookId}_q_${i}`,
                    chapterId: chapterId,
                    number: i,
                    questionImage: `${config.qDir}/${i}번_문제.png`,
                    answerImage: `${config.aDir}/${i}번_해설.png`
                });
            }

            isScanning = false;
            closeModal();
        }

        async function initApp() {
            await scanCurrentBook();
            renderNavigation();
        }

        // 캔버스 필기 기능
        const canvasContexts = {};
        window.setupCanvas = function(qId) {
            const img = document.getElementById(`img-${qId}`);
            const canvas = document.getElementById(`canvas-${qId}`);
            if (!img || !canvas) return;

            canvas.width = img.naturalWidth || 800;
            canvas.height = img.naturalHeight || 400;

            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            canvasContexts[qId] = { ctx: ctx, isDrawing: false, color: 'black', mode: 'pen' };

            const getMousePos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let clientX = e.clientX;
                let clientY = e.clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            };

            const startDrawing = (e) => {
                if (canvas.style.pointerEvents === 'none') return;
                e.preventDefault();
                const pos = getMousePos(e);
                const state = canvasContexts[qId];
                state.isDrawing = true;
                state.ctx.beginPath();
                state.ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                const state = canvasContexts[qId];
                if (!state || !state.isDrawing) return;
                e.preventDefault();
                const pos = getMousePos(e);
                const scaleRatio = canvas.width / img.clientWidth;
                state.ctx.lineWidth = scaleRatio * (state.mode === 'eraser' ? 25 : 3);
                
                if (state.mode === 'eraser') {
                    state.ctx.globalCompositeOperation = 'destination-out';
                    state.ctx.strokeStyle = 'rgba(0,0,0,1)'; 
                } else {
                    state.ctx.globalCompositeOperation = 'source-over';
                    state.ctx.strokeStyle = state.color;
                }
                state.ctx.lineTo(pos.x, pos.y);
                state.ctx.stroke();
            };

            const stopDrawing = () => { if (canvasContexts[qId]) canvasContexts[qId].isDrawing = false; };

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            canvas.addEventListener('touchstart', startDrawing, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stopDrawing);
        };

        window.toggleDrawMode = function(qId) {
            const canvas = document.getElementById(`canvas-${qId}`);
            const btn = document.getElementById(`btn-draw-${qId}`);
            const tools = document.getElementById(`draw-tools-${qId}`);
            
            if (canvas.style.pointerEvents === 'none') {
                canvas.style.pointerEvents = 'auto';
                btn.innerHTML = '❌ 필기 끄기';
                btn.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-300');
                btn.classList.remove('bg-gray-100', 'text-gray-700');
                tools.classList.remove('hidden');
                tools.classList.add('flex');
            } else {
                canvas.style.pointerEvents = 'none';
                btn.innerHTML = '✏️ 필기 켜기';
                btn.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-300');
                btn.classList.add('bg-gray-100', 'text-gray-700');
                tools.classList.add('hidden');
                tools.classList.remove('flex');
            }
        };

        window.setDrawColor = function(qId, color, btnEl) {
            if (!canvasContexts[qId]) return;
            canvasContexts[qId].mode = 'pen';
            canvasContexts[qId].color = color;
            const buttons = document.querySelectorAll(`.color-btn-${qId}`);
            buttons.forEach(b => b.classList.replace('ring-gray-400', 'ring-transparent'));
            if (btnEl) btnEl.classList.replace('ring-transparent', 'ring-gray-400');
        };

        window.setDrawMode = function(qId, mode) {
            if (!canvasContexts[qId]) return;
            canvasContexts[qId].mode = mode;
        };

        window.clearCanvas = function(qId) {
            const canvas = document.getElementById(`canvas-${qId}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        initApp();
    </script>
</body>
</html>
