<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 수능특강/수능완성 지구과학 문제은행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 🖨️ 인쇄(PDF 저장)용 최적화 스타일 */
        @media print {
            @page { margin: 15mm; }
            html, body, main, #main-scroll-area {
                height: auto !important; min-height: auto !important;
                overflow: visible !important; position: static !important;
                display: block !important; background: white !important;
            }
            .question-card {
                page-break-inside: avoid !important; break-inside: avoid !important;
                box-shadow: none !important; border: 1px solid #e2e8f0 !important;
                margin-bottom: 2rem !important; padding-bottom: 1rem !important;
            }
            button, #timer-display, header, aside, #sidebar-overlay, .mock-intro-box, .draw-toolbar, .print\:hidden {
                display: none !important;
            }
            .print-q .answer-section { display: none !important; }
            .print-a .question-image-section { display: none !important; }
            .print-a .answer-section { 
                display: block !important; border: none !important; 
                padding: 0 !important; background: transparent !important; 
            }
        }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden flex bg-slate-50 relative">

    <div id="timer-display" class="hidden fixed top-6 right-6 bg-gray-900 text-white px-6 py-3 rounded-2xl font-mono text-2xl shadow-2xl z-50 flex items-center gap-3 border border-gray-700">
        <svg class="w-6 h-6 text-red-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="time-left" class="font-bold tracking-wider">30:00</span>
    </div>

    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center fade-in">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-5">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 id="modal-title" class="text-2xl font-bold text-gray-800 mb-2">알림</h3>
            <p id="modal-message" class="text-gray-600 mb-8 font-medium">메시지 내용</p>
            <button onclick="closeModal()" class="w-full px-4 py-3.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-colors font-bold text-lg shadow-sm">확인</button>
        </div>
    </div>

    <!-- Sidebar (폰트 크기 전체적으로 축소) -->
    <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 z-40 flex-shrink-0 transition-transform duration-300 absolute md:static h-full transform -translate-x-full md:translate-x-0 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)] hidden md:flex">
        <div class="p-5 flex-1 overflow-y-auto">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
                <h1 class="text-xl font-extrabold text-blue-600 tracking-tight">지구과학 문제은행</h1>
                <button onclick="toggleSidebar()" class="md:hidden p-1.5 text-gray-400 hover:text-gray-600 bg-gray-50 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- 교재 선택 드롭다운 -->
            <div class="mb-6">
                <h2 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-2 px-1">교재 선택</h2>
                <select id="book-selector" onchange="changeBook(this.value)" class="w-full p-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-700 font-bold text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer shadow-sm">
                    <option value="main">📘 2027 수능특강</option>
                    <option value="suwan">📙 2027 수능완성</option>
                </select>
            </div>
            
            <h2 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-2 px-1">단원 선택</h2>
            <nav id="chapter-nav" class="space-y-1 mb-8">
                <!-- Chapters will be rendered here -->
            </nav>

            <h2 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-2 px-1">+기능</h2>
            <nav class="space-y-1">
                <button onclick="showMockExamIntro()" class="w-full text-left px-3 py-2.5 rounded-lg transition-all duration-200 font-bold text-sm text-purple-700 bg-purple-50 hover:bg-purple-100 flex items-center justify-between border border-purple-100">
                    <span class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        모의고사 만들기
                    </span>
                </button>
            </nav>
        </div>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900 bg-opacity-20 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full w-full bg-slate-50 relative">
        <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 z-10 px-6 py-4 flex items-center gap-4 flex-shrink-0">
            <button onclick="toggleSidebar()" class="p-2.5 bg-white rounded-xl shadow-sm border border-gray-200 text-gray-600 hover:text-blue-600 hover:bg-blue-50 transition-all flex-shrink-0" title="메뉴 숨기기/보이기">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
            </button>
            <div class="overflow-hidden">
                <h2 id="current-chapter-title" class="text-xl md:text-2xl font-bold text-gray-800 truncate">단원을 선택해주세요</h2>
                <p id="current-chapter-desc" class="text-sm text-gray-500 mt-0.5 truncate">왼쪽 메뉴에서 단원이나 기능을 선택하세요.</p>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-10" id="main-scroll-area">
            <div id="question-container" class="max-w-4xl mx-auto hidden pb-20"></div>
            
            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center fade-in pb-20">
                <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 mb-6">
                    <svg class="w-12 h-12 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-700 mb-2" id="welcome-title">학습을 시작해볼까요?</h3>
                <p class="text-gray-500" id="welcome-desc">왼쪽 메뉴에서 학습할 단원을 선택하면 문제가 표시됩니다.</p>
            </div>
        </div>
    </main>

    <script>
        // 단원 목록 정보
        const chaptersInfo = [
            { id: 'ch1', title: '1. 지권의 변동' },
            { id: 'ch2', title: '2. 지구의 역사' },
            { id: 'ch3', title: '3. 대기와 해양의 변화' },
            { id: 'ch4', title: '4. 상호작용' },
            { id: 'ch5', title: '5. 별과 외계 행성계' },
            { id: 'ch6', title: '6. 외부 은하와 우주 팽창' },
            { id: 'ch7', title: '7. 수능완성 실전 모의고사' } // 수능완성 전용
        ];

        // 📚 교재(Book) 설정 및 단원 분류 기준
        const booksConfig = {
            main: {
                title: "2027 수능특강",
                shortTitle: "특강",
                qDir: "q",
                aDir: "a",
                getChapterId: function(num) {
                    if (num >= 1 && num <= 48) return 'ch1';
                    if (num >= 49 && num <= 102) return 'ch2';
                    if (num >= 103 && num <= 142) return 'ch3';
                    if (num >= 143 && num <= 206) return 'ch4';
                    if (num >= 207 && num <= 270) return 'ch5';
                    return 'ch6'; 
                }
            },
            suwan: {
                title: "2027 수능완성",
                shortTitle: "수완",
                qDir: "suwan_q",
                aDir: "suwan_a",
                getChapterId: function(num) {
                    if (num >= 1 && num <= 36) return 'ch1';
                    if (num >= 37 && num <= 83) return 'ch2';
                    if (num >= 84 && num <= 111) return 'ch3';
                    if (num >= 112 && num <= 154) return 'ch4';
                    if (num >= 155 && num <= 197) return 'ch5';
                    if (num >= 198 && num <= 231) return 'ch6';
                    return 'ch7';
                }
            }
        };

        const db = { questions: { main: [], suwan: [] } };

        const chapterNav = document.getElementById('chapter-nav');
        const currentChapterTitle = document.getElementById('current-chapter-title');
        const currentChapterDesc = document.getElementById('current-chapter-desc');
        const questionContainer = document.getElementById('question-container');
        const emptyState = document.getElementById('empty-state');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const timerDisplay = document.getElementById('timer-display');
        const timeLeftSpan = document.getElementById('time-left');
        const customModal = document.getElementById('custom-modal');
        const modalMessage = document.getElementById('modal-message');
        const mainScrollArea = document.getElementById('main-scroll-area');

        let currentBookId = 'main'; 
        let currentChapterId = null;
        let isMockExamMode = false;
        let timerInterval = null;
        let timeLeft = 1800;
        let isScanning = false;

        // 페이징 및 정렬 관련 변수
        let chapterQuestions = [];
        let currentPage = 1;
        const itemsPerPage = 5;
        let isRandomMode = false;
        
        // 애플펜슬 모드 (팜 리젝션) 글로벌 변수
        let isPenOnlyMode = false;

        function toggleSidebar() {
            if (window.innerWidth < 768) {
                sidebar.classList.toggle('hidden');
                sidebar.classList.toggle('-translate-x-full');
                sidebarOverlay.classList.toggle('hidden');
            } else {
                sidebar.classList.toggle('md:hidden');
                sidebar.classList.toggle('hidden');
            }
        }

        function showModal(message) {
            modalMessage.innerText = message;
            customModal.classList.remove('hidden');
        }

        function closeModal() {
            if(!isScanning) customModal.classList.add('hidden');
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            timerDisplay.classList.add('hidden'); timerDisplay.classList.remove('fade-in');
        }

        function startTimer() {
            stopTimer();
            timeLeft = 1800;
            timeLeftSpan.innerText = formatTime(timeLeft);
            timeLeftSpan.classList.remove('text-red-400');
            timerDisplay.classList.remove('hidden');
            timerDisplay.classList.add('fade-in');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timeLeftSpan.innerText = formatTime(timeLeft);
                if (timeLeft <= 300) timeLeftSpan.classList.add('text-red-400');
                if (timeLeft <= 0) {
                    stopTimer();
                    showModal("모의고사 제한 시간 30분이 모두 지났습니다. 수고하셨습니다!");
                }
            }, 1000);
        }

        function printPDF(type) {
            document.body.classList.add('print-mode');
            if (type === 'q') document.body.classList.add('print-q');
            if (type === 'a') {
                document.body.classList.add('print-a');
                document.querySelectorAll('.answer-section').forEach(el => el.classList.remove('hidden'));
            }
            window.print();
            setTimeout(() => {
                document.body.classList.remove('print-mode', 'print-q', 'print-a');
                if (type === 'a') {
                    document.querySelectorAll('.answer-section').forEach(el => el.classList.add('hidden'));
                }
            }, 1000);
        }

        function renderNavigation() {
            chapterNav.innerHTML = '';
            chaptersInfo.forEach(chapter => {
                if (currentBookId === 'main' && chapter.id === 'ch7') return;

                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2.5 rounded-lg transition-all duration-200 font-bold text-sm border border-transparent ${
                    currentChapterId === chapter.id && !isMockExamMode
                    ? 'bg-blue-50 text-blue-700 border-blue-100 shadow-sm' 
                    : 'text-gray-600 hover:bg-gray-50 hover:border-gray-100'
                }`;
                btn.innerText = chapter.title;
                btn.onclick = () => selectChapter(chapter.id);
                chapterNav.appendChild(btn);
            });
        }

        function selectChapter(chapterId) {
            currentChapterId = chapterId;
            isMockExamMode = false;
            stopTimer();
            renderNavigation(); 

            const chapter = chaptersInfo.find(c => c.id === chapterId);
            if (chapter) {
                currentChapterTitle.innerText = chapter.title;
                const filtered = db.questions[currentBookId].filter(q => q.chapterId === chapterId);
                
                if(filtered.length > 0) {
                    currentChapterDesc.innerText = `총 ${filtered.length}문제 (한 페이지에 5문제씩 보기)`;
                } else {
                    currentChapterDesc.innerText = "이 단원에는 등록된 문제가 없습니다.";
                }
                
                chapterQuestions = [...filtered];
                currentPage = 1;
                isRandomMode = false; 
                
                emptyState.classList.add('hidden');
                questionContainer.classList.remove('hidden');
                
                applySortAndRender();
                if(window.innerWidth < 768 && !sidebar.classList.contains('-translate-x-full')) toggleSidebar();
            }
        }

        window.setSortMode = function(mode) {
            isRandomMode = (mode === 'random');
            currentPage = 1;
            applySortAndRender();
        };

        function applySortAndRender() {
            if (isRandomMode) {
                for (let i = chapterQuestions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [chapterQuestions[i], chapterQuestions[j]] = [chapterQuestions[j], chapterQuestions[i]];
                }
            } else {
                chapterQuestions.sort((a, b) => a.number - b.number);
            }
            renderChapterPage();
        }

        window.changePage = function(delta) {
            const totalPages = Math.ceil(chapterQuestions.length / itemsPerPage);
            currentPage += delta;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderChapterPage();
            mainScrollArea.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function renderChapterPage() {
            const totalPages = Math.ceil(chapterQuestions.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageQuestions = chapterQuestions.slice(startIndex, endIndex);

            let headerHtml = `
                <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-gray-100 mb-6 gap-4 print:hidden">
                    <div class="flex bg-gray-100 p-1 rounded-xl w-full sm:w-auto">
                        <button onclick="setSortMode('seq')" class="flex-1 sm:w-24 px-4 py-2 text-sm font-bold rounded-lg transition-colors ${!isRandomMode ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}">순서대로</button>
                        <button onclick="setSortMode('random')" class="flex-1 sm:w-24 px-4 py-2 text-sm font-bold rounded-lg transition-colors ${isRandomMode ? 'bg-white text-purple-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}">랜덤으로</button>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="changePage(-1)" class="p-2 rounded-lg bg-gray-50 hover:bg-gray-100 disabled:opacity-50 transition-colors" ${currentPage === 1 || totalPages === 0 ? 'disabled' : ''}>
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <span class="text-sm font-bold text-gray-700">${currentPage} <span class="text-gray-400 font-normal">/ ${totalPages || 1}</span></span>
                        <button onclick="changePage(1)" class="p-2 rounded-lg bg-gray-50 hover:bg-gray-100 disabled:opacity-50 transition-colors" ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''}>
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
                <div id="chapter-questions-render-area" class="space-y-8 pb-10"></div>
            `;
            
            questionContainer.innerHTML = headerHtml;
            renderQuestions(pageQuestions, false, 'chapter-questions-render-area');
        }

        function showMockExamIntro() {
            currentChapterId = null;
            isMockExamMode = true;
            stopTimer();
            renderNavigation(); 

            currentChapterTitle.innerText = "모의고사 만들기";
            currentChapterDesc.innerText = "출제 범위와 교재를 선택하고 실전처럼 테스트해 보세요.";

            let bookCheckboxesHtml = `
                <label class="flex items-center gap-3 p-2 hover:bg-white rounded-lg cursor-pointer transition-colors border border-transparent hover:border-gray-200">
                    <input type="checkbox" name="mock-book" value="main" checked class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer">
                    <span class="text-gray-700 font-bold text-sm md:text-base">📘 수능특강</span>
                </label>
                <label class="flex items-center gap-3 p-2 hover:bg-white rounded-lg cursor-pointer transition-colors border border-transparent hover:border-gray-200">
                    <input type="checkbox" name="mock-book" value="suwan" checked class="w-5 h-5 text-orange-500 rounded border-gray-300 focus:ring-orange-500 cursor-pointer">
                    <span class="text-gray-700 font-bold text-sm md:text-base">📙 수능완성</span>
                </label>
            `;

            let chapterCheckboxesHtml = chaptersInfo.map(ch => `
                <label class="flex items-center gap-3 p-2 hover:bg-white rounded-lg cursor-pointer transition-colors border border-transparent hover:border-gray-200">
                    <input type="checkbox" name="mock-chapter" value="${ch.id}" checked class="w-5 h-5 text-purple-600 rounded border-gray-300 focus:ring-purple-500 cursor-pointer">
                    <span class="text-gray-700 font-medium text-sm md:text-base">${ch.title}</span>
                </label>
            `).join('');

            questionContainer.innerHTML = `
                <div class="mock-intro-box bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-gray-100 text-center mt-4 md:mt-10 fade-in">
                    <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-4 tracking-tight">모의고사 설정</h3>
                    <p class="text-gray-500 mb-8 max-w-md mx-auto leading-relaxed">선택된 교재와 범위 내에서 무작위로 20문제가 출제됩니다.</p>
                    
                    <div class="text-left max-w-2xl mx-auto mb-6 bg-slate-50 p-6 rounded-2xl border border-gray-200 shadow-inner">
                        <h4 class="font-bold text-gray-700 mb-4 px-2 flex items-center gap-2">📚 대상 교재 선택 (섞기 가능)</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="mock-book-checkboxes">${bookCheckboxesHtml}</div>
                    </div>

                    <div class="text-left max-w-2xl mx-auto mb-10 bg-slate-50 p-6 rounded-2xl border border-gray-200 shadow-inner">
                        <h4 class="font-bold text-gray-700 mb-4 px-2 flex items-center gap-2">🎯 출제 범위 선택</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="mock-chapter-checkboxes">${chapterCheckboxesHtml}</div>
                    </div>

                    <button onclick="startMockExam()" class="px-8 py-4 bg-purple-600 text-white text-lg rounded-2xl hover:bg-purple-700 font-bold flex items-center justify-center gap-3 mx-auto w-full sm:w-auto shadow-md transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        모의고사 시작하기
                    </button>
                    
                    <div id="mock-pdf-buttons" class="hidden justify-center gap-3 mt-6 fade-in flex-wrap print:hidden">
                        <button onclick="printPDF('q')" class="px-5 py-3 bg-gray-800 text-white text-sm font-bold rounded-xl shadow hover:bg-gray-700 transition-colors flex items-center gap-2">📝 문제 PDF 저장</button>
                        <button onclick="printPDF('a')" class="px-5 py-3 bg-green-700 text-white text-sm font-bold rounded-xl shadow hover:bg-green-600 transition-colors flex items-center gap-2">💡 해설 PDF 저장</button>
                    </div>
                </div>
                <div id="mock-questions-render-area" class="space-y-8 mt-8 pb-10"></div>
            `;
            
            emptyState.classList.add('hidden');
            questionContainer.classList.remove('hidden');
            if(window.innerWidth < 768 && !sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        window.startMockExam = function() {
            const bookCheckboxes = document.querySelectorAll('#mock-book-checkboxes input[type="checkbox"]:checked');
            const chapterCheckboxes = document.querySelectorAll('#mock-chapter-checkboxes input[type="checkbox"]:checked');
            
            const selectedBookIds = Array.from(bookCheckboxes).map(cb => cb.value);
            const selectedChapterIds = Array.from(chapterCheckboxes).map(cb => cb.value);

            if (selectedBookIds.length === 0) return showModal("출제할 교재를 최소 1개 이상 선택해주세요.");
            if (selectedChapterIds.length === 0) return showModal("출제할 단원을 최소 1개 이상 선택해주세요.");

            let filteredQuestions = [];
            selectedBookIds.forEach(bId => {
                const qList = db.questions[bId].filter(q => selectedChapterIds.includes(q.chapterId));
                filteredQuestions = filteredQuestions.concat(qList);
            });

            if (filteredQuestions.length === 0) return showModal("선택한 범위에 문제가 없습니다. (파일 미업로드 또는 빈 단원)");

            const allQuestions = [...filteredQuestions];
            for (let i = allQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
            }
            const mockQuestions = allQuestions.slice(0, 20);

            currentChapterDesc.innerText = "제한 시간 30분! 실전처럼 집중해서 풀어보세요.";
            const pdfButtons = document.getElementById('mock-pdf-buttons');
            pdfButtons.classList.remove('hidden'); pdfButtons.classList.add('flex');

            renderQuestions(mockQuestions, true, 'mock-questions-render-area');
            startTimer();
            setTimeout(() => { document.getElementById('mock-questions-render-area').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        }

        window.toggleGlobalPenMode = function() {
            isPenOnlyMode = !isPenOnlyMode;
            document.querySelectorAll('.pen-mode-btn').forEach(btn => {
                if (isPenOnlyMode) {
                    btn.innerHTML = '✋ 터치방지: ON';
                    btn.classList.add('text-blue-700', 'bg-blue-100');
                    btn.classList.remove('text-gray-500', 'hover:bg-gray-200');
                } else {
                    btn.innerHTML = '✋ 터치방지: OFF';
                    btn.classList.remove('text-blue-700', 'bg-blue-100');
                    btn.classList.add('text-gray-500', 'hover:bg-gray-200');
                }
            });
        }

        function renderQuestions(questions, isMock = false, targetId = 'question-container') {
            const container = document.getElementById(targetId);
            container.innerHTML = '';
            
            if (questions.length === 0) {
                container.innerHTML = `<div class="bg-white p-10 rounded-2xl shadow-sm text-center border border-gray-100 fade-in"><p class="text-gray-500">이 단원에는 아직 문제가 없습니다.</p></div>`;
                return;
            }

            questions.forEach((q, index) => {
                const qEl = document.createElement('div');
                qEl.className = 'question-card bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 fade-in transition-shadow hover:shadow-md';
                qEl.style.animationDelay = `${index * 0.05}s`;
                
                let questionLabel = isMock ? `문제 ${index + 1}` : `문제 ${q.number}`;
                let chapterTitle = chaptersInfo.find(c=>c.id===q.chapterId)?.title.split(' ')[0] || '';
                let bookBadgeColor = q.bookId === 'main' ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-orange-50 text-orange-600 border-orange-100';
                
                let sourceBadge = isMock 
                    ? `<div class="flex gap-1.5"><span class="px-2 py-1 ${bookBadgeColor} rounded text-[11px] font-bold border">[${booksConfig[q.bookId].shortTitle}]</span><span class="px-2 py-1 bg-purple-50 text-purple-600 rounded text-[11px] font-bold border border-purple-100">${chapterTitle} 단원</span></div>` 
                    : `<span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold border border-blue-100">${booksConfig[q.bookId].title}</span>`;

                let penModeBtnStyle = isPenOnlyMode 
                    ? 'text-blue-700 bg-blue-100' 
                    : 'text-gray-500 hover:bg-gray-200';
                let penModeBtnText = isPenOnlyMode ? '✋ 터치방지: ON' : '✋ 터치방지: OFF';

                qEl.innerHTML = `
                    <div class="p-6 md:p-8">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xl font-extrabold text-gray-800">${questionLabel}</h3>
                            ${sourceBadge}
                        </div>
                        
                        <div class="draw-toolbar flex justify-end mb-3 print:hidden">
                            <div id="draw-tools-${q.id}" class="hidden flex-wrap items-center gap-2 bg-gray-100 px-3 py-1.5 rounded-lg shadow-inner">
                                <div class="flex items-center gap-1.5 border-r border-gray-300 pr-2">
                                    <button onclick="setDrawColor('${q.id}', 'black', this)" class="w-4 h-4 rounded-full bg-black ring-2 ring-offset-1 ring-gray-400 transition-all color-btn-${q.id}"></button>
                                    <button onclick="setDrawColor('${q.id}', 'red', this)" class="w-4 h-4 rounded-full bg-red-500 ring-2 ring-offset-1 ring-transparent transition-all color-btn-${q.id}"></button>
                                    <button onclick="setDrawColor('${q.id}', 'blue', this)" class="w-4 h-4 rounded-full bg-blue-500 ring-2 ring-offset-1 ring-transparent transition-all color-btn-${q.id}"></button>
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="setDrawMode('${q.id}', 'eraser')" class="text-xs font-bold text-gray-600 hover:text-gray-900 px-2 py-1 rounded hover:bg-gray-200 transition-colors">지우개</button>
                                    <button onclick="clearCanvas('${q.id}')" class="text-xs font-bold text-red-500 hover:text-red-700 px-2 py-1 rounded hover:bg-red-50 transition-colors">모두지우기</button>
                                    <div class="w-px h-3 bg-gray-300 mx-1"></div>
                                    <button onclick="toggleGlobalPenMode()" class="pen-mode-btn text-[11px] font-bold px-2 py-1 rounded transition-colors ${penModeBtnStyle}" title="스마트펜/마우스만 인식하고 손가락 터치는 무시합니다.">${penModeBtnText}</button>
                                </div>
                            </div>
                            <button onclick="toggleDrawMode('${q.id}')" id="btn-draw-${q.id}" class="ml-2 px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-all font-bold flex items-center gap-1 text-xs border border-gray-200 shadow-sm">
                                ✏️ 필기 켜기
                            </button>
                        </div>

                        <div class="question-image-section mb-6 border border-gray-100 rounded-xl p-3 bg-gray-50 flex justify-center overflow-hidden relative">
                            <div class="relative inline-block max-w-full">
                                <img id="img-${q.id}" src="${q.questionImage}" alt="${questionLabel}" class="max-w-full h-auto rounded-lg select-none" draggable="false" onload="setupCanvas('${q.id}')" onerror="this.src='https://placehold.co/800x400/f8fafc/94a3b8?text=이미지+로드+실패'">
                                <canvas id="canvas-${q.id}" class="absolute top-0 left-0 w-full h-full touch-none z-10 rounded-lg" style="pointer-events: none; touch-action: none;"></canvas>
                            </div>
                        </div>

                        <div class="flex justify-end border-t border-gray-100 pt-4 print:hidden">
                            <button onclick="toggleAnswer('${q.id}')" id="btn-toggle-${q.id}" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition-all font-bold flex items-center gap-1.5 shadow-sm">
                                <span>정답 및 해설</span>
                                <svg class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div id="answer-${q.id}" class="answer-section hidden border-t-2 border-dashed border-gray-200 bg-slate-50/50 p-6 md:p-8">
                        <div class="border border-gray-200 rounded-xl p-3 bg-white shadow-sm flex justify-center">
                            <img src="${q.answerImage}" alt="해설" class="max-w-full h-auto rounded-lg" onerror="this.src='https://placehold.co/800x400/f8fafc/94a3b8?text=해설+이미지+로드+실패'">
                        </div>
                    </div>
                `;
                container.appendChild(qEl);
            });
        }

        window.toggleAnswer = function(questionId) {
            const answerDiv = document.getElementById(`answer-${questionId}`);
            const btn = document.getElementById(`btn-toggle-${questionId}`);
            const span = btn.querySelector('span');
            const icon = btn.querySelector('svg');

            if (answerDiv.classList.contains('hidden')) {
                answerDiv.classList.remove('hidden'); answerDiv.classList.add('fade-in');
                btn.classList.replace('bg-blue-600', 'bg-gray-600'); btn.classList.replace('hover:bg-blue-700', 'hover:bg-gray-700');
                span.innerText = '해설 닫기'; icon.style.transform = 'rotate(180deg)';
            } else {
                answerDiv.classList.add('hidden'); answerDiv.classList.remove('fade-in');
                btn.classList.replace('bg-gray-600', 'bg-blue-600'); btn.classList.replace('hover:bg-gray-700', 'hover:bg-blue-700');
                span.innerText = '정답 및 해설'; icon.style.transform = 'rotate(0deg)';
            }
        };

        // 자동 스캔 알고리즘
        async function checkFileExists(url) {
            try { const res = await fetch(url, { method: 'HEAD', cache: 'no-cache' }); return res.ok; } catch { return false; }
        }

        async function findMaxQuestionCount(dirPath) {
            let low = 1, high = 1;
            if (!(await checkFileExists(`${dirPath}/1번_문제.png`))) return 0; 
            while (await checkFileExists(`${dirPath}/${high}번_문제.png`)) { low = high; high *= 2; }
            let maxFound = low, l = low, h = high - 1;
            while (l <= h) {
                const mid = Math.floor((l + h) / 2);
                if (await checkFileExists(`${dirPath}/${mid}번_문제.png`)) { maxFound = mid; l = mid + 1; } 
                else { h = mid - 1; }
            }
            return maxFound;
        }

        async function scanBook(bookId) {
            if (db.questions[bookId].length > 0) return; 
            const config = booksConfig[bookId];
            const maxNum = await findMaxQuestionCount(config.qDir);
            for (let i = 1; i <= maxNum; i++) {
                db.questions[bookId].push({
                    id: `${bookId}_q_${i}`, bookId: bookId, chapterId: config.getChapterId(i), number: i,
                    questionImage: `${config.qDir}/${i}번_문제.png`, answerImage: `${config.aDir}/${i}번_해설.png`
                });
            }
        }

        window.changeBook = async function(bookId) {
            currentBookId = bookId; currentChapterId = null; isMockExamMode = false; stopTimer();
            currentChapterTitle.innerText = "단원을 선택해주세요";
            currentChapterDesc.innerText = "왼쪽 메뉴에서 단원이나 기능을 선택하세요.";
            emptyState.classList.remove('hidden'); questionContainer.classList.add('hidden');
            document.getElementById('welcome-title').innerText = `${booksConfig[bookId].title} 학습 시작!`;
            renderNavigation();
        }

        async function initApp() {
            isScanning = true; showModal("문제를 스캔중입니다.");
            await scanBook('main'); 
            await scanBook('suwan');
            isScanning = false; closeModal();
            changeBook('main'); 
        }

        // 캔버스 필기 기능 (PointerEvent 기반 - 팜 리젝션 지원)
        const canvasContexts = {};
        window.setupCanvas = function(qId) {
            const img = document.getElementById(`img-${qId}`);
            const canvas = document.getElementById(`canvas-${qId}`);
            if (!img || !canvas) return;

            canvas.width = img.naturalWidth || 800;
            canvas.height = img.naturalHeight || 400;

            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            canvasContexts[qId] = { ctx: ctx, isDrawing: false, color: 'black', mode: 'pen' };

            const getMousePos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
                return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
            };

            const startDrawing = (e) => {
                if (canvas.style.pointerEvents === 'none') return;
                // 팜 리젝션: 애플펜슬 모드일 때 터치는 무시 (마우스나 펜만 허용)
                if (isPenOnlyMode && e.pointerType === 'touch') return;
                // 마우스일 경우 좌클릭만 허용
                if (e.pointerType === 'mouse' && e.buttons !== 1) return;

                e.preventDefault(); 
                const pos = getMousePos(e); 
                const state = canvasContexts[qId];
                state.isDrawing = true; 
                state.ctx.beginPath(); 
                state.ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                const state = canvasContexts[qId];
                if (!state || !state.isDrawing) return;
                e.preventDefault(); 
                const pos = getMousePos(e);
                state.ctx.lineWidth = (canvas.width / img.clientWidth) * (state.mode === 'eraser' ? 30 : 3);
                if (state.mode === 'eraser') { 
                    state.ctx.globalCompositeOperation = 'destination-out'; 
                    state.ctx.strokeStyle = 'rgba(0,0,0,1)'; 
                } else { 
                    state.ctx.globalCompositeOperation = 'source-over'; 
                    state.ctx.strokeStyle = state.color; 
                }
                state.ctx.lineTo(pos.x, pos.y); 
                state.ctx.stroke();
            };

            const stopDrawing = () => { if (canvasContexts[qId]) canvasContexts[qId].isDrawing = false; };
            
            // PointerEvents 리스너 등록
            canvas.addEventListener('pointerdown', startDrawing); 
            canvas.addEventListener('pointermove', draw); 
            canvas.addEventListener('pointerup', stopDrawing); 
            canvas.addEventListener('pointerout', stopDrawing);
            canvas.addEventListener('pointercancel', stopDrawing);
        };

        window.toggleDrawMode = function(qId) {
            const canvas = document.getElementById(`canvas-${qId}`);
            const btn = document.getElementById(`btn-draw-${qId}`);
            const tools = document.getElementById(`draw-tools-${qId}`);
            if (canvas.style.pointerEvents === 'none') {
                canvas.style.pointerEvents = 'auto'; btn.innerHTML = '❌ 필기 끄기';
                btn.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-300'); btn.classList.remove('bg-gray-100', 'text-gray-700');
                tools.classList.remove('hidden'); tools.classList.add('flex');
            } else {
                canvas.style.pointerEvents = 'none'; btn.innerHTML = '✏️ 필기 켜기';
                btn.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-300'); btn.classList.add('bg-gray-100', 'text-gray-700');
                tools.classList.add('hidden'); tools.classList.remove('flex');
            }
        };

        window.setDrawColor = function(qId, color, btnEl) {
            if (!canvasContexts[qId]) return;
            canvasContexts[qId].mode = 'pen'; canvasContexts[qId].color = color;
            document.querySelectorAll(`.color-btn-${qId}`).forEach(b => b.classList.replace('ring-gray-400', 'ring-transparent'));
            if (btnEl) btnEl.classList.replace('ring-transparent', 'ring-gray-400');
        };
        
        window.setDrawMode = function(qId, mode) { 
            if (canvasContexts[qId]) canvasContexts[qId].mode = mode; 
        };
        
        window.clearCanvas = function(qId) { 
            const canvas = document.getElementById(`canvas-${qId}`); 
            if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height); 
        };

        initApp();
    </script>
</body>
