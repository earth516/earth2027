<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 수능 지구과학 문제은행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc; /* bg-slate-50 */
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 🖨️ 인쇄(PDF 저장)용 스타일 추가 */
        @media print {
            body * { visibility: hidden; }
            
            .print-mode #main-scroll-area, 
            .print-mode #main-scroll-area *,
            .print-mode #question-container,
            .print-mode #question-container * {
                visibility: visible;
            }
            
            .print-mode #main-scroll-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                overflow: visible;
                padding: 0;
            }
            
            /* 페이지 짤림 방지 및 스타일 제거 */
            .print-mode .question-card {
                page-break-inside: avoid;
                break-inside: avoid;
                box-shadow: none;
                border: 1px solid #e2e8f0;
                margin-bottom: 2rem;
            }
            
            /* 불필요한 UI 숨김 */
            .print-mode button, 
            .print-mode #timer-display,
            .print-mode header,
            .print-mode aside {
                display: none !important;
            }
            
            /* 문제만 출력 모드 */
            .print-q .answer-section { display: none !important; }
            
            /* 해설만 출력 모드 */
            .print-a .question-image-section { display: none !important; }
            .print-a .answer-section { display: block !important; border: none; padding: 0; }
        }
    </style>
</head>
<body class="text-gray-800 h-screen overflow-hidden flex bg-slate-50 relative">

    <!-- Floating Timer (Hidden by default) -->
    <div id="timer-display" class="hidden fixed top-6 right-6 bg-gray-900 text-white px-6 py-3 rounded-2xl font-mono text-2xl shadow-2xl z-50 flex items-center gap-3 border border-gray-700">
        <svg class="w-6 h-6 text-red-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="time-left" class="font-bold tracking-wider">30:00</span>
    </div>

    <!-- Custom Alert Modal -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center fade-in">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-5">
                <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 id="modal-title" class="text-2xl font-bold text-gray-800 mb-2">알림</h3>
            <p id="modal-message" class="text-gray-600 mb-8 font-medium">메시지 내용</p>
            <button onclick="closeModal()" class="w-full px-4 py-3.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-colors font-bold text-lg shadow-sm">확인</button>
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 z-40 flex-shrink-0 transition-all duration-300 absolute md:static h-full transform -translate-x-full md:translate-x-0 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="p-6 flex-1 overflow-y-auto">
            <div class="flex justify-between items-center mb-8 pb-4 border-b border-gray-100">
                <h1 class="text-2xl font-extrabold text-blue-600 tracking-tight">지구과학 문제은행</h1>
                <!-- Close button for mobile -->
                <button onclick="toggleSidebar()" class="md:hidden p-2 text-gray-400 hover:text-gray-600 bg-gray-50 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 px-2">단원 선택</h2>
            <nav id="chapter-nav" class="space-y-1.5 mb-10">
                <!-- Chapters will be rendered here -->
            </nav>

            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 px-2">+기능</h2>
            <nav class="space-y-1.5">
                <button onclick="showMockExamIntro()" class="w-full text-left px-4 py-3.5 rounded-xl transition-all duration-200 font-semibold text-purple-700 bg-purple-50 hover:bg-purple-100 flex items-center justify-between border border-purple-100 hover:border-purple-200 hover:shadow-sm">
                    <span class="flex items-center gap-2.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        모의고사 만들기
                    </span>
                    <svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </nav>
        </div>
    </aside>

    <!-- Overlay for mobile sidebar (데스크톱에서는 안 보이게 md:hidden 추가) -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900 bg-opacity-20 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden w-full bg-slate-50 relative">
        
        <!-- Header with Toggle Button -->
        <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 z-10 px-6 py-4 flex items-center gap-4 flex-shrink-0">
            <button onclick="toggleSidebar()" class="p-2.5 bg-white rounded-xl shadow-sm border border-gray-200 text-gray-600 hover:text-blue-600 hover:border-blue-200 hover:bg-blue-50 transition-all flex-shrink-0" title="메뉴 숨기기/보이기">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
            </button>
            <div class="overflow-hidden">
                <h2 id="current-chapter-title" class="text-xl md:text-2xl font-bold text-gray-800 truncate">단원을 선택해주세요</h2>
                <p id="current-chapter-desc" class="text-sm text-gray-500 mt-0.5 truncate">왼쪽 메뉴에서 단원이나 기능을 선택하세요.</p>
            </div>
        </header>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-6 md:p-10" id="main-scroll-area">
            
            <!-- Question Container -->
            <div id="question-container" class="max-w-4xl mx-auto space-y-8 hidden pb-20">
                <!-- Questions will be injected here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center fade-in pb-20">
                <div class="w-24 h-24 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 mb-6">
                    <svg class="w-12 h-12 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-700 mb-2">학습을 시작해볼까요?</h3>
                <p class="text-gray-500">왼쪽 메뉴에서 학습할 단원을 선택하면 문제가 표시됩니다.</p>
            </div>
        </div>
    </main>

    <script>
        // Data Structure for the Question Bank
        const db = {
            chapters: [
                {
                    id: 'ch1',
                    title: 'I. 고체 지구',
                    description: '지권의 변동, 지구의 역사'
                },
                {
                    id: 'ch2',
                    title: 'II. 대기와 해양',
                    description: '대기와 해양의 변화, 상호 작용'
                },
                {
                    id: 'ch3',
                    title: 'III. 우주',
                    description: '별과 외계 행성계, 외부 은하와 우주 팽창'
                }
            ],
            questions: [] // 폴더 자동 스캔 알고리즘을 통해 자동으로 채워집니다.
        };

        // DOM Elements
        const chapterNav = document.getElementById('chapter-nav');
        const currentChapterTitle = document.getElementById('current-chapter-title');
        const currentChapterDesc = document.getElementById('current-chapter-desc');
        const questionContainer = document.getElementById('question-container');
        const emptyState = document.getElementById('empty-state');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const timerDisplay = document.getElementById('timer-display');
        const timeLeftSpan = document.getElementById('time-left');
        const customModal = document.getElementById('custom-modal');
        const modalMessage = document.getElementById('modal-message');
        const mainScrollArea = document.getElementById('main-scroll-area');

        let currentChapterId = null;
        let isMockExamMode = false;
        let timerInterval = null;
        let timeLeft = 1800; // 30 minutes in seconds

        function toggleSidebar() {
            // Mobile toggle
            sidebar.classList.toggle('-translate-x-full');
            // Desktop toggle (using negative margin to collapse)
            sidebar.classList.toggle('md:-ml-[18rem]'); // 72 * 0.25rem = 18rem
            // Overlay visibility
            sidebarOverlay.classList.toggle('hidden');
        }

        function showModal(message) {
            modalMessage.innerText = message;
            customModal.classList.remove('hidden');
        }

        function closeModal() {
            customModal.classList.add('hidden');
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerDisplay.classList.add('hidden');
            timerDisplay.classList.remove('fade-in');
        }

        function startTimer() {
            stopTimer(); // Ensure no duplicates
            timeLeft = 1800; // Reset to 30 mins
            timeLeftSpan.innerText = formatTime(timeLeft);
            timeLeftSpan.classList.remove('text-red-400');
            timerDisplay.classList.remove('hidden');
            timerDisplay.classList.add('fade-in');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timeLeftSpan.innerText = formatTime(timeLeft);
                
                // Change color to red when 5 minutes (300s) or less remain
                if (timeLeft <= 300) {
                    timeLeftSpan.classList.add('text-red-400');
                }
                
                if (timeLeft <= 0) {
                    stopTimer();
                    showModal("모의고사 제한 시간 30분이 모두 지났습니다. 수고하셨습니다!");
                }
            }, 1000);
        }

        // PDF 인쇄/저장 함수 추가
        function printPDF(type) {
            document.body.classList.add('print-mode');
            if (type === 'q') document.body.classList.add('print-q');
            if (type === 'a') document.body.classList.add('print-a');
            
            // 해설 PDF 저장 시 모든 해설창을 강제로 열어줍니다.
            if (type === 'a') {
                document.querySelectorAll('.answer-section').forEach(el => el.classList.remove('hidden'));
            }

            // 브라우저 기본 인쇄창 띄우기 (여기서 'PDF로 저장' 선택 가능)
            window.print();
            
            // 프린트창이 닫힌 후 UI 원상복구
            setTimeout(() => {
                document.body.classList.remove('print-mode', 'print-q', 'print-a');
                if (type === 'a') {
                    document.querySelectorAll('.answer-section').forEach(el => el.classList.add('hidden'));
                }
            }, 1000);
        }

        function renderNavigation() {
            chapterNav.innerHTML = '';
            db.chapters.forEach(chapter => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 rounded-xl transition-all duration-200 font-medium border border-transparent ${
                    currentChapterId === chapter.id && !isMockExamMode
                    ? 'bg-blue-50 text-blue-700 border-blue-100 shadow-sm' 
                    : 'text-gray-600 hover:bg-gray-50 hover:border-gray-100'
                }`;
                btn.innerText = chapter.title;
                btn.onclick = () => selectChapter(chapter.id);
                chapterNav.appendChild(btn);
            });
        }

        function selectChapter(chapterId) {
            currentChapterId = chapterId;
            isMockExamMode = false;
            stopTimer(); // Stop timer if switching back to normal chapter
            renderNavigation(); 

            const chapter = db.chapters.find(c => c.id === chapterId);
            if (chapter) {
                currentChapterTitle.innerText = chapter.title;
                currentChapterDesc.innerText = chapter.description;
                
                const chapterQuestions = db.questions.filter(q => q.chapterId === chapterId);
                renderQuestions(chapterQuestions);
                
                emptyState.classList.add('hidden');
                questionContainer.classList.remove('hidden');
                mainScrollArea.scrollTo(0, 0);

                // Auto-hide sidebar on mobile after selection
                if(window.innerWidth < 768 && !sidebar.classList.contains('-translate-x-full')) {
                    toggleSidebar();
                }
            }
        }

        function showMockExamIntro() {
            currentChapterId = null;
            isMockExamMode = true;
            stopTimer();
            renderNavigation(); // Update active state visually

            currentChapterTitle.innerText = "모의고사 만들기";
            currentChapterDesc.innerText = "전 범위에서 무작위로 문제를 출제합니다.";

            // Render Intro Screen
            questionContainer.innerHTML = `
                <div class="bg-white p-10 md:p-14 rounded-3xl shadow-sm border border-gray-100 text-center mt-4 md:mt-10 fade-in">
                    <div class="w-24 h-24 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg class="w-12 h-12 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-4 tracking-tight">준비되셨나요?</h3>
                    <p class="text-gray-500 mb-10 max-w-md mx-auto leading-relaxed">모의고사 시작 버튼을 누르면 <strong class="text-purple-600">30분의 타이머</strong>가 작동하며 최대 20개의 문제가 무작위로 출제됩니다.</p>
                    <button onclick="startMockExam()" class="px-8 py-4 bg-purple-600 text-white text-lg rounded-2xl hover:bg-purple-700 hover:shadow-lg transition-all font-bold flex items-center justify-center gap-3 mx-auto w-full sm:w-auto transform hover:-translate-y-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        모의고사 시작하기
                    </button>
                </div>
            `;
            
            emptyState.classList.add('hidden');
            questionContainer.classList.remove('hidden');

            if(window.innerWidth < 768 && !sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function startMockExam() {
            // Get all questions and shuffle
            const allQuestions = [...db.questions];
            for (let i = allQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
            }

            // Pick up to 20
            const mockQuestions = allQuestions.slice(0, 20);

            // 설명창에 PDF 다운로드 버튼 추가
            currentChapterDesc.innerHTML = `
                <div class="flex flex-wrap items-center gap-4 mt-2">
                    <span class="text-sm font-medium">제한 시간 30분! 실전처럼 집중해서 풀어보세요.</span>
                    <div class="flex gap-2">
                        <button onclick="printPDF('q')" class="px-3 py-1.5 bg-gray-800 text-white text-xs font-bold rounded-lg shadow hover:bg-gray-700 transition-colors">📝 문제 PDF 저장</button>
                        <button onclick="printPDF('a')" class="px-3 py-1.5 bg-green-700 text-white text-xs font-bold rounded-lg shadow hover:bg-green-600 transition-colors">💡 해설 PDF 저장</button>
                    </div>
                </div>
            `;
            
            renderQuestions(mockQuestions, true);
            startTimer();
            mainScrollArea.scrollTo(0, 0);
        }

        function renderQuestions(questions, isMock = false) {
            questionContainer.innerHTML = '';
            
            if (questions.length === 0) {
                questionContainer.innerHTML = `
                    <div class="bg-white p-10 rounded-2xl shadow-sm text-center border border-gray-100 fade-in">
                        <p class="text-gray-500">이 단원에 등록된 문제가 없습니다. 폴더에 파일이 있는지 확인해주세요.</p>
                    </div>
                `;
                return;
            }

            questions.forEach((q, index) => {
                const qEl = document.createElement('div');
                // 클래스에 question-card 추가
                qEl.className = 'question-card bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 fade-in transition-shadow hover:shadow-md';
                qEl.style.animationDelay = `${index * 0.05}s`;
                
                // Determine label based on mode
                let questionLabel = isMock ? `문제 ${index + 1}` : `문제 ${q.number}`;
                let sourceBadge = isMock 
                    ? `<span class="px-3 py-1 bg-purple-50 text-purple-600 rounded-full text-xs font-bold border border-purple-100">${db.chapters.find(c=>c.id===q.chapterId)?.title.split(' ')[0]} 단원</span>` 
                    : `<span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-bold border border-blue-100">2027 대비</span>`;

                qEl.innerHTML = `
                    <div class="p-6 md:p-8">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xl font-extrabold text-gray-800">${questionLabel}</h3>
                            ${sourceBadge}
                        </div>
                        
                        <!-- Question Image (클래스 question-image-section 추가) -->
                        <div class="question-image-section mb-8 border border-gray-100 rounded-xl p-3 bg-gray-50 flex justify-center">
                            <img src="${q.questionImage}" alt="${questionLabel}" class="max-w-full h-auto rounded-lg" onerror="this.src='https://placehold.co/800x400/f8fafc/94a3b8?text=이미지+로드+실패'">
                        </div>

                        <!-- Action Button -->
                        <div class="flex justify-end border-t border-gray-100 pt-6">
                            <button onclick="toggleAnswer('${q.id}')" id="btn-toggle-${q.id}" class="px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all font-semibold flex items-center gap-2 shadow-sm hover:shadow">
                                <span>정답 및 해설 보기</span>
                                <svg class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Answer Section (클래스 answer-section 추가) -->
                    <div id="answer-${q.id}" class="answer-section hidden border-t-2 border-dashed border-gray-200 bg-slate-50/50 p-6 md:p-8">
                        <h4 class="font-extrabold text-gray-700 mb-4 flex items-center gap-2 text-lg">
                            <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            정답 및 해설
                        </h4>
                        <div class="border border-gray-200 rounded-xl p-3 bg-white shadow-sm flex justify-center">
                            <img src="${q.answerImage}" alt="해설" class="max-w-full h-auto rounded-lg" onerror="this.src='https://placehold.co/800x400/f8fafc/94a3b8?text=해설+이미지+로드+실패'">
                        </div>
                    </div>
                `;
                questionContainer.appendChild(qEl);
            });
        }

        window.toggleAnswer = function(questionId) {
            const answerDiv = document.getElementById(`answer-${questionId}`);
            const btn = document.getElementById(`btn-toggle-${questionId}`);
            const span = btn.querySelector('span');
            const icon = btn.querySelector('svg');

            if (answerDiv.classList.contains('hidden')) {
                // Show
                answerDiv.classList.remove('hidden');
                answerDiv.classList.add('fade-in');
                btn.classList.replace('bg-blue-600', 'bg-gray-600');
                btn.classList.replace('hover:bg-blue-700', 'hover:bg-gray-700');
                span.innerText = '해설 닫기';
                icon.style.transform = 'rotate(180deg)';
            } else {
                // Hide
                answerDiv.classList.add('hidden');
                answerDiv.classList.remove('fade-in');
                btn.classList.replace('bg-gray-600', 'bg-blue-600');
                btn.classList.replace('hover:bg-gray-700', 'hover:bg-blue-700');
                span.innerText = '정답 및 해설 보기';
                icon.style.transform = 'rotate(0deg)';
            }
        };

        // ==========================================
        // 🚀 자동 폴더 스캔 알고리즘 (이진 탐색 적용)
        // ==========================================
        
        // 특정 파일이 존재하는지 가볍게(HEAD) 찔러보는 함수
        async function checkFileExists(url) {
            try {
                const response = await fetch(url, { method: 'HEAD', cache: 'no-cache' });
                return response.ok;
            } catch {
                return false;
            }
        }

        // 특정 챕터 폴더에 몇 번 문제까지 있는지 초고속으로 찾는 함수
        async function findMaxQuestionCount(chapterId) {
            let low = 1;
            let high = 1;

            // 1번 문제가 없으면 0개 반환
            if (!(await checkFileExists(`${chapterId}/q/1번_문제.png`))) {
                return 0; 
            }

            // 1. 배수 탐색 (1, 2, 4, 8, 16, 32...) 으로 대략적인 한계점 찾기
            while (await checkFileExists(`${chapterId}/q/${high}번_문제.png`)) {
                low = high;
                high *= 2;
            }

            // 2. 이진 탐색 (업다운 게임) 으로 정확한 마지막 문제 번호 찾기
            let maxFound = low;
            let l = low;
            let h = high - 1;
            
            while (l <= h) {
                const mid = Math.floor((l + h) / 2);
                if (await checkFileExists(`${chapterId}/q/${mid}번_문제.png`)) {
                    maxFound = mid; // 존재하면 더 높은 숫자 탐색
                    l = mid + 1;
                } else {
                    h = mid - 1; // 존재하지 않으면 더 낮은 숫자 탐색
                }
            }
            return maxFound;
        }

        // 앱 초기화 및 자동 스캔 실행
        async function initApp() {
            showModal("폴더에서 문제 데이터를 자동으로 스캔 중입니다...\n잠시만 기다려주세요.");
            
            // 각 챕터별로 스캔을 동시에 진행
            const scanPromises = db.chapters.map(async (chapter) => {
                const maxNum = await findMaxQuestionCount(chapter.id);
                const chapterQuestions = [];
                for (let i = 1; i <= maxNum; i++) {
                    chapterQuestions.push({
                        id: `q_${chapter.id}_${i}`,
                        chapterId: chapter.id,
                        number: i,
                        questionImage: `${chapter.id}/q/${i}번_문제.png`,
                        answerImage: `${chapter.id}/a/${i}번_해설.png`
                    });
                }
                return chapterQuestions;
            });

            // 모든 폴더 스캔이 끝날 때까지 대기
            const results = await Promise.all(scanPromises);
            
            // 스캔된 결과를 메인 데이터(db.questions)에 합치기
            results.forEach(questions => {
                db.questions = db.questions.concat(questions);
            });

            closeModal(); // 로딩 알림창 닫기
            renderNavigation(); // 완료 후 좌측 메뉴 그리기
        }

        // Initialize the app
        initApp();
    </script>
</body>
